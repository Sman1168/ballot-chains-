<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballot Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow column that works as a console. Status banner and tally first, then register, vote booth, and the ledger where tampering is demonstrated. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --fg: #14201c;
  --muted: #55655f;
  --line: #d3dbd8;
  --accent: #0b6e5a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --ok: #17794a;
  --ok-soft: #dff3e8;
  --bad: #b8321f;
  --bad-soft: #fbe6e2;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1614; --surface: #16211e; --fg: #e5eeea; --muted: #94a69e; --line: #2a3b36;
    --accent: #3cc7a4; --accent-ink: #05231b; --accent-soft: #163c33;
    --ok: #55d18f; --ok-soft: #14352a; --bad: #ff8070; --bad-soft: #3b1d18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1614; --surface: #16211e; --fg: #e5eeea; --muted: #94a69e; --line: #2a3b36;
  --accent: #3cc7a4; --accent-ink: #05231b; --accent-soft: #163c33;
  --ok: #55d18f; --ok-soft: #14352a; --bad: #ff8070; --bad-soft: #3b1d18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; line-height: 1.1; }
h2 { font-size: 1.15rem; }
p { margin: 0; }
.sub { color: var(--muted); max-width: 62ch; }
.mono { font-family: var(--font-mono); font-size: 0.8rem; overflow-wrap: anywhere; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
header { display: flex; flex-direction: column; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.banner { border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; border: 1px solid transparent; }
.banner.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.banner.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.banner strong { font-family: var(--font-display); font-size: 1.05rem; display: block; }
.banner span.d { color: var(--fg); font-size: 0.88rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="text"], select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; flex: 1 1 160px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  font: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.cands { display: flex; gap: 8px; flex-wrap: wrap; }
.cands label { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; background: var(--bg); }
.cands input { accent-color: var(--accent); }
.cands label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.msg { font-size: 0.88rem; color: var(--muted); min-height: 1.3em; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.tally { display: flex; flex-direction: column; gap: 10px; }
.tally-row { display: grid; grid-template-columns: 90px 1fr 34px; gap: 10px; align-items: center; }
.bar { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.tally-row b { text-align: right; font-variant-numeric: tabular-nums; }
.voters { display: flex; flex-direction: column; }
.voter { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.voter:first-child { border-top: 0; }
.voter .who { font-weight: 600; flex: 1 1 120px; min-width: 0; }
.voter .cred { flex: 2 1 200px; color: var(--muted); min-width: 0; }
.chip { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.chip.wait { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.blocks { display: flex; flex-direction: column; gap: 12px; }
.block { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); min-width: 0; }
.block.bad { border-color: var(--bad); background: var(--bad-soft); }
.block-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 3px 10px; align-items: baseline; }
.kv dt { color: var(--muted); font-size: 0.75rem; }
.kv dd { margin: 0; min-width: 0; }
.kv dd.diff { color: var(--bad); }
.vlist { display: flex; flex-direction: column; gap: 6px; }
.vote { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.vote .cand { font-weight: 600; min-width: 70px; }
.vote .mono { color: var(--muted); flex: 1 1 120px; }
.pending { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
footer { color: var(--muted); font-size: 0.82rem; max-width: 66ch; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.3s; } }
body { margin: 0; }
</style>
